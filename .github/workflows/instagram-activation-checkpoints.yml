name: Instagram activation checkpoints

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Experiment ID (비우면 게시된 모든 실험)'
        required: false
        default: ''
      instagram_snapshot_path:
        description: 'Optional checked-in/UI snapshot JSON path when Graph API is unavailable'
        required: false
        default: ''
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

concurrency:
  group: instagram-activation-checkpoints
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      experiments: ${{ steps.list.outputs.experiments }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify activation tooling
        run: npm run test:instagram

      - name: Discover published experiments
        id: list
        shell: bash
        env:
          REQUESTED_EXPERIMENT: ${{ inputs.experiment }}
        run: |
          if [[ -n "${REQUESTED_EXPERIMENT}" ]]; then
            EXPERIMENTS="$(node tools/list-instagram-activation-experiments.mjs \
              --experiment="${REQUESTED_EXPERIMENT}" --json)"
          else
            EXPERIMENTS="$(node tools/list-instagram-activation-experiments.mjs --json)"
          fi
          echo "experiments=${EXPERIMENTS}" >> "${GITHUB_OUTPUT}"

  checkpoint-status:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        experiment: ${{ fromJSON(needs.discover.outputs.experiments) }}
    env:
      EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Determine due checkpoint
        id: due
        shell: bash
        run: |
          # The report exits 2 when a checkpoint is due. That is the signal this
          # step exists to read, not a failure — swallowing it here keeps the
          # "Refuse silent checkpoint miss" guard below reachable. Any other
          # non-zero exit is a real error and must still stop the job.
          set +e
          REPORT="$(
            node tools/instagram-activation-report.mjs \
              --experiment="${EXPERIMENT}" \
              --json 2>/dev/null
          )"
          STATUS=$?
          set -e
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 2 ]; then
            echo "activation report failed with exit ${STATUS}" >&2
            exit "${STATUS}"
          fi
          CHECKPOINT="$(
            printf '%s' "${REPORT}" |
              jq -r 'if .nextAction.action == "collect-now" then .nextAction.checkpoint else "" end'
          )"
          echo "checkpoint=${CHECKPOINT}" >> "${GITHUB_OUTPUT}"

      - name: Refuse silent checkpoint miss
        if: >-
          ${{
            steps.due.outputs.checkpoint != ''
            && vars.ACTIVATION_COLLECT_ENABLED != 'true'
            && inputs.instagram_snapshot_path == ''
          }}
        shell: bash
        run: |
          {
            echo "Instagram activation checkpoint is due but automatic collection is disabled."
            echo "Set repository variable ACTIVATION_COLLECT_ENABLED=true only after"
            echo "IG_USER_ID, IG_ACCESS_TOKEN, and FORESTTOUR_ADMIN_KEY are ready."
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Collect Instagram Insights
        id: instagram_snapshot
        if: >-
          ${{
            vars.ACTIVATION_COLLECT_ENABLED == 'true'
            && steps.due.outputs.checkpoint != ''
            && inputs.instagram_snapshot_path == ''
          }}
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node tools/ig-insights.mjs collect --live

      - name: Use supplied Instagram UI snapshot
        id: instagram_snapshot_file
        if: >-
          ${{
            steps.due.outputs.checkpoint != ''
            && inputs.instagram_snapshot_path != ''
          }}
        shell: bash
        run: |
          test -f "${{ inputs.instagram_snapshot_path }}"
          echo "path=${{ inputs.instagram_snapshot_path }}" >> "${GITHUB_OUTPUT}"

      - name: Record Instagram activation metrics
        id: instagram_record
        if: >-
          ${{
            always()
            && steps.due.outputs.checkpoint != ''
          }}
        continue-on-error: true
        shell: bash
        run: |
          INSIGHTS_FILE="${{ inputs.instagram_snapshot_path }}"
          if [[ -z "${INSIGHTS_FILE}" ]]; then
            INSIGHTS_FILE="$(find data/insights -type f -name '*.json' -print | sort | tail -n 1)"
          fi
          if [[ -z "${INSIGHTS_FILE}" || ! -f "${INSIGHTS_FILE}" ]]; then
            echo "Instagram Insights snapshot is unavailable." >&2
            exit 1
          fi
          node tools/collect-instagram-activation-metrics.mjs \
            --experiment="${EXPERIMENT}" \
            --checkpoint="${{ steps.due.outputs.checkpoint }}" \
            --instagram-file="${INSIGHTS_FILE}" \
            $([[ -n "${{ inputs.instagram_snapshot_path }}" ]] && echo '--instagram-source=instagram-ui')

      - name: Record foresttour activation metrics
        id: foresttour_record
        if: >-
          ${{
            always()
            && vars.ACTIVATION_COLLECT_ENABLED == 'true'
            && steps.due.outputs.checkpoint != ''
          }}
        continue-on-error: true
        env:
          FORESTTOUR_ADMIN_KEY: ${{ secrets.FORESTTOUR_ADMIN_KEY }}
        shell: bash
        run: |
          if [[ -z "${FORESTTOUR_ADMIN_KEY}" ]]; then
            echo "::warning::FORESTTOUR_ADMIN_KEY is not configured."
            exit 1
          fi
          node tools/collect-instagram-activation-metrics.mjs \
            --experiment="${EXPERIMENT}" \
            --checkpoint="${{ steps.due.outputs.checkpoint }}" \
            --foresttour-live

      - name: Require at least one collected source
        if: >-
          ${{
            always()
            && (
              vars.ACTIVATION_COLLECT_ENABLED == 'true'
              || inputs.instagram_snapshot_path != ''
            )
            && steps.due.outputs.checkpoint != ''
          }}
        shell: bash
        run: |
          if git diff --quiet -- "data/activation/${EXPERIMENT}"; then
            {
              echo "No activation source was collected for ${EXPERIMENT}."
              echo "Instagram outcome: ${{ steps.instagram_record.outcome }}"
              echo "foresttour outcome: ${{ steps.foresttour_record.outcome }}"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Persist collected checkpoint
        if: >-
          ${{
            always()
            && (
              vars.ACTIVATION_COLLECT_ENABLED == 'true'
              || inputs.instagram_snapshot_path != ''
            )
            && steps.due.outputs.checkpoint != ''
            && (
              steps.instagram_record.outcome == 'success'
              || steps.foresttour_record.outcome == 'success'
            )
          }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/activation/${EXPERIMENT}"
          git diff --cached --quiet && exit 0
          git commit -m "data: record ${EXPERIMENT} ${{ steps.due.outputs.checkpoint }} checkpoint"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report due checkpoints
        if: ${{ always() }}
        shell: bash
        run: |
          set -o pipefail
          node tools/instagram-activation-report.mjs \
            --experiment="${EXPERIMENT}" | tee -a "${GITHUB_STEP_SUMMARY}"

  learn:
    if: ${{ always() }}
    needs: [discover, checkpoint-status]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Matrix jobs may have pushed checkpoints after this workflow started.
          # Read the branch head so learning includes records from this run.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compare experiments and recommend next actions
        run: node tools/instagram-activation-learn.mjs | tee -a "${GITHUB_STEP_SUMMARY}"
