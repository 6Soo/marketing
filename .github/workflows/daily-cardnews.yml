name: 마케팅 루프 엔진 — 일일 사이클

# 마케팅 루프 자동화 파이프라인.
#   Sense(성과 수집) → Think(기획) → Create(렌더) → Publish(멀티채널 배포) → Learn(학습).
#
# 워크플로 구성:
#   daily-sense   — 매일 09:00 KST: 전일 인스타 성과 데이터 수집
#   daily-publish — 매일 20:00 KST: 렌더 + JPEG 변환 + 멀티채널 게시
#   weekly-think  — 매주 일요일 18:00 KST: 주간 분석 리포트 + 다음 주 기획
#   monthly-learn — 매월 1일 09:00 KST: 월간 전략 갱신 + 학습 문서 생성
#
# 실게시 전환(사장님-가이드 §인스타):
#   1) Secrets: IG_USER_ID, IG_ACCESS_TOKEN
#   2) workflow_dispatch에서 step=publish, publish_live=true
#   3) 사진이 검증 완료 상태인지 확인(대역 사진은 기본 차단)

on:
  workflow_dispatch:
    inputs:
      step:
        description: '실행할 단계 (full, sense, publish, analyze, strategy)'
        required: false
        default: 'full'
      series:
        description: '시리즈 경로'
        required: false
        default: 'cardnews/series/sanriku'
      publish_live:
        description: 'Instagram API로 실제 게시'
        required: true
        type: boolean
        default: false

# 공개 JPEG 배포와 운영 계정 검증 전에는 예약 실행하지 않는다.
# 준비 완료 후 schedule을 복구하고 각 단계의 실제 산출물을 먼저 3회 수동 검수한다.

concurrency:
  group: marketing-loop
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERIES_PATH: ${{ inputs.series || 'cardnews/series/sanriku' }}

jobs:
  # ─── Sense: 인스타그램 성과 데이터 수집 ───────────────────
  sense:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.step == 'full' || inputs.step == 'sense')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인스타 Insights 수집
        if: ${{ vars.LOOP_SENSE_ENABLED == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node tools/ig-insights.mjs collect --live

      - name: 수집 데이터 아티팩트
        if: ${{ vars.LOOP_SENSE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-insights-${{ github.run_id }}
          path: data/insights/
          if-no-files-found: error

  # ─── Publish: 렌더 + 변환 + 멀티채널 게시 ─────────────────
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.step == 'full' || inputs.step == 'publish')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JPEG 변환기(sharp) 설치
        run: npm install sharp

      - name: Chromium 설치(headless 렌더용)
        run: npx --yes playwright install --with-deps chromium

      - name: 실게시 안전조건 검사
        if: ${{ inputs.publish_live == true }}
        run: |
          node cardnews/tools/daily-publish.mjs \
            --series="${SERIES_PATH}" \
            --validate-live

      # ① 렌더 + JPEG 변환 + 공개 배포용 스테이징
      - name: 렌더·JPEG 스테이징
        env:
          CHROME_BIN: ''
          PUBLIC_DIR: ${{ github.workspace }}/_stage/instagram/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node cardnews/tools/daily-publish.mjs \
            --series="${SERIES_PATH}" \
            --stamp="${{ github.run_id }}-${{ github.run_attempt }}" \
            --stage-only

      - name: 스테이징 JPEG 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-jpeg-${{ github.run_id }}
          path: _stage/instagram/
          if-no-files-found: error

      # ② 전용 브랜치에 JPEG 공개 배포. 고정 commit SHA URL이라 CDN 캐시 충돌이 없다.
      - name: JPEG 공개 배포
        if: ${{ inputs.publish_live == true }}
        id: deploy_assets
        env:
          ASSET_DIR: ${{ github.workspace }}/_stage/instagram/${{ github.run_id }}-${{ github.run_attempt }}
          ASSET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ASSET_WORKTREE="${RUNNER_TEMP}/instagram-assets"

          if git ls-remote --exit-code origin refs/heads/instagram-assets >/dev/null 2>&1; then
            git fetch origin instagram-assets
            git worktree add -B instagram-assets "$ASSET_WORKTREE" origin/instagram-assets
          else
            git worktree add --detach "$ASSET_WORKTREE"
            cd "$ASSET_WORKTREE"
            git checkout --orphan instagram-assets
            git rm -rf .
            cd "$GITHUB_WORKSPACE"
          fi

          mkdir -p "$ASSET_WORKTREE/instagram/$ASSET_KEY"
          cp "$ASSET_DIR"/*.jpg "$ASSET_WORKTREE/instagram/$ASSET_KEY/"

          cd "$ASSET_WORKTREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "instagram/$ASSET_KEY"
          git commit -m "assets: Instagram ${ASSET_KEY}"
          git push origin HEAD:instagram-assets

          ASSET_SHA="$(git rev-parse HEAD)"
          PUBLIC_BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSET_SHA}/instagram/${ASSET_KEY}"
          echo "asset_sha=$ASSET_SHA" >> "$GITHUB_OUTPUT"
          echo "public_base_url=$PUBLIC_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: 공개 JPEG 접근 확인
        if: ${{ inputs.publish_live == true }}
        env:
          PUBLIC_BASE_URL: ${{ steps.deploy_assets.outputs.public_base_url }}
          ASSET_DIR: ${{ github.workspace }}/_stage/instagram/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          FIRST_FILE="$(find "$ASSET_DIR" -maxdepth 1 -type f -name '*.jpg' -printf '%f\n' | sort | head -n 1)"
          test -n "$FIRST_FILE"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --output /dev/null \
            "${PUBLIC_BASE_URL}/${FIRST_FILE}"

      # ③ 인스타 발행 (캐러셀)
      - name: 인스타 발행
        if: ${{ inputs.publish_live == true }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_DIR: ${{ github.workspace }}/_stage/instagram/${{ github.run_id }}-${{ github.run_attempt }}
          PUBLIC_BASE_URL: ${{ steps.deploy_assets.outputs.public_base_url }}
        run: |
          node cardnews/tools/daily-publish.mjs \
            --series="${SERIES_PATH}" \
            --stamp="${{ github.run_id }}-${{ github.run_attempt }}" \
            --skip-render \
            --publish \
            --channels=ig

      - name: 게시 결과 아티팩트
        if: ${{ inputs.publish_live == true }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-publish-result-${{ github.run_id }}
          path: _stage/instagram/${{ github.run_id }}-${{ github.run_attempt }}/_publish-result-*.json
          if-no-files-found: error
          retention-days: 90

      # ④ 카페/밴드용 콘텐츠 생성 (반자동 — 결과를 아티팩트로 저장)
      - name: 카페 게시글 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p _stage/cafe _stage/band
          node tools/cafe-publish.mjs --series=${{ env.SERIES_PATH }} --output=_stage/cafe/post.html || echo "카페 게시글 생성 건너뜀"

      - name: 밴드 게시글 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DAY=$(date -u +%a | tr '[:upper:]' '[:lower:]')
          node tools/band-publish.mjs --series=${{ env.SERIES_PATH }} --day=$DAY --output=_stage/band/post.txt || echo "밴드 게시글 생성 건너뜀"

      - name: 멀티채널 콘텐츠 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: multichannel-content-${{ github.run_id }}
          path: |
            _stage/cafe/
            _stage/band/
          if-no-files-found: warn

  # ─── Analyze: 주간 분석 리포트 ─────────────────────────────
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.step == 'full' || inputs.step == 'analyze')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 주간 성과 분석
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/analyzer.mjs report

      - name: 분석 결과 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: marketing-analysis-${{ github.run_id }}
          path: |
            strategy/주간리포트-*.md
            data/performance.json
          if-no-files-found: error

  # ─── Strategy: 월간 전략 갱신 ──────────────────────────────
  strategy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.step == 'strategy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 월간 전략 갱신 + 학습 문서 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/strategy-updater.mjs

      - name: 전략 결과 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: marketing-strategy-${{ github.run_id }}
          path: learning/
